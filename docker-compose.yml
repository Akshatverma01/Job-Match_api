services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: job_match
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_match"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/job_match?schema=public
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
